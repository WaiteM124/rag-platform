name: Evaluation Gates

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'ingest/**'
      - 'evals/**'
      - 'collections/**'
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'ingest/**'
      - 'evals/**'
      - 'collections/**'
      - 'pyproject.toml'

permissions:
  contents: read
  id-token: write

jobs:
  eval-gate-complex-systems:
    name: Complex Systems Eval Gate
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: raglocal
          POSTGRES_DB: ragplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:raglocal@localhost:5432/ragplatform
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip notice when eval role unset
        if: ${{ vars.AWS_EVAL_ROLE_ARN == '' }}
        run: |
          echo "::notice::AWS_EVAL_ROLE_ARN is not set. Skipping Bedrock-backed eval gate."
          echo "Re-apply terraform/bootstrap from CloudShell to create rag-platform-eval, then set the GitHub variable."

      - name: Configure AWS credentials (eval role)
        if: ${{ vars.AWS_EVAL_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Seed database (class A/B + C abstracts fixture)
        run: python scripts/seed_ci_corpus.py

      - name: pgvector integration tests (always)
        run: pytest -q tests/unit tests/integration

      - name: Run fast eval + injection metrics (needs Bedrock)
        if: ${{ vars.AWS_EVAL_ROLE_ARN != '' }}
        id: bedrock_eval
        continue-on-error: true
        run: make eval COLLECTION=complex-systems FAST=1

      - name: Notice when Bedrock eval unavailable
        if: steps.bedrock_eval.outcome == 'failure'
        run: |
          echo "::warning::Bedrock full eval did not pass (model access or seller verification)."
          echo "The hard gate is pgvector integration tests above; fix model access then re-run."

  eval-gate-uk-tax:
    name: UK Tax Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Placeholder
        run: |
          echo "UK Tax eval gate remains placeholder until Phase 5."

  injection-suite:
    name: Prompt Injection Suite
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Covered inside Complex Systems eval job when AWS_EVAL_ROLE_ARN is set."