services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: raglocal
      POSTGRES_DB: ragplatform
    ports:
      - "5432:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_pgdata: